services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gogen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gogen}
      POSTGRES_DB: ${POSTGRES_DB:-gogen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gogen} -d ${POSTGRES_DB:-gogen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  usersvc:
    build:
      context: .
      dockerfile: docker/usersvc/Dockerfile
    ports:
      - "8090:8090"
    environment:
      USER_SVC_ADDR: ":8090"

volumes:
  postgres_data:
  ollama_data:
